<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivos</title>
</head>
<body>
    <hr>
    <header>
        <nav>
            <a href="{% url 'detalhes_materia' id=id_materia %}">Voltar</a>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <article>
                <h1>Arquivos</h1>
                
                {% for arquivo in arquivos %}
                
                    <label>{{arquivo.data_anexo}}</label>
                    <p><a href="{{arquivo.arquivo.url}}">{{arquivo.nome}}</a></p>
                    <a href="{% url 'excluir_item' 'arquivo_trabalho' arquivo.ID_arquivo %}">Excluir</a>
                {% endfor %}
            </article>
        </section>
        <section>
            <form method="post" enctype="multipart/form-data">
                <fieldset>
                    {% csrf_token %}
                    {{form.as_p}}
                </fieldset>
                <button type="submit">Enviar arquivo</button>
            </form>
        </section>
    </main>
</body>
</html>
