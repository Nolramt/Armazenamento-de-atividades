<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Períodos</title>
</head>
<body>
    <header>
        <nav></nav>
    </header>
    <main>
        <section>
            <h2 id="titulo-periodos">Meus períodos</h2>
            {% for periodo in periodos %}
                <article>
                    
                    <h3>
                        <a href="{% url 'lista_materias' periodo.ID_periodo %}">
                            {{periodo.nome}}</a>
                    </h3>
                    <p>Ano: {{periodo.ano}}</p>
                    <nav aria-label="Ações do período">
                        <a href="{% url 'editar_item' 'periodo' periodo.ID_periodo %}">Editar</a>
                        <a href="{% url 'excluir_item' 'periodo' periodo.ID_periodo %}">Excluir</a>
                    </nav>
                </article>
            {% empty %}
                <p>Nenhum período cadastrado ainda.</p>
            {% endfor %}

        </section>
        <section aria-labelledby="titulo-adicionar">
            <form method="post">
                {% csrf_token %}
                
                <fieldset>
                    <legend id="titulo-adicionar">Adicionar período</legend>
                    
                    {{form.as_p}}

                    <button type="submit">Adicionar</button>
                </fieldset>
            </form>
        </section>
    </main>
    <footer>
        <p>Armazenamento de Atividades</p>
    </footer>
</body>
</html>
