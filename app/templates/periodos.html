<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Períodos</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'app/css/estilo.css' %}">
</head>
<body>
    <div id="header">
        <header>
            <div class="nav-header">
                <nav></nav>
            </div>
        </header>
    </div>
    <div id="main">
        <main>
            <div id="section">
                <section>
                    <h2 id="titulo-periodos">Meus períodos</h2>
                    {% for periodo in periodos %}
                    <div class="article">
                        <article>
                            
                            <h3>
                                <a href="{% url 'lista_materias' periodo.ID_periodo %}">
                                    {{periodo.nome}}</a>
                            </h3>
                            <p>Ano: {{periodo.ano}}</p>

                            <div class="nav-acoes">
                                <nav aria-label="Ações do período">
                                    <a href="{% url 'editar_item' 'periodo' periodo.ID_periodo %}">Editar</a>
                                    <a href="{% url 'excluir_item' 'periodo' periodo.ID_periodo %}">Excluir</a>
                                </nav>
                            </div>
                        </article>
                    </div>
                    {% empty %}
                        <p>Nenhum período cadastrado.</p>
                    {% endfor %}

                </section>
            </div>
            <div id="section-form">
                <section aria-labelledby="titulo-adicionar">
                    <div class="formulario">
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            <fieldset>
                                <legend id="titulo-adicionar">Adicionar período</legend>
                                
                                {{form.as_p}}

                                <button type="submit">Adicionar</button>
                            </fieldset>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <div class="footer">
        <footer>
            <p>Armazenamento de Atividades</p>
        </footer>
    </div>
</body>
</html>
