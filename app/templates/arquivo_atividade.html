<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivos</title>
</head>
<body>
    <hr>
    <header>
        <nav>
            <a href="{% url 'detalhes_materia' id=id_materia %}">Voltar</a>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit">Adicionar arquivo</button>
            </form>
            <article>
                <h1>Arquivos</h1>
                {% for arquivo in arquivos %}
                    <article>
                        <label>Data de anexo: {{arquivo.data_anexo}}</label>
                        <p><a href="{{arquivo.arquivo.url}}">{{arquivo.nome}}</a></p>
                        
                    </article>
                {% endfor %}
            </article>
        </section>
    </main>
</body>
</html>
