<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matérias</title>
</head>
<body>
    <hr>
    <header>
        <nav>
            <a href="{% url 'lista_periodos' %}">Períodos</a>
        </nav>
    </header>
    <hr>
    <main>
        <section>
            <h1>Matérias</h1>
            {% for materia in materias %}
                <a href="{% url 'detalhes_materia' materia.ID_materia %}">
                <h2>{{materia.nome}}</h2>
                </a>
                <a href="{% url 'editar_item' 'materia' materia.ID_materia %}">Editar</a>
                <a href="{% url 'excluir_item' 'materia' materia.ID_materia %}">Excluir</a>
            {% endfor %}
        </section>
        <section>
            <form method="post">
                <fieldset>
                    <p><strong>Adicionar matéria:</strong></p>
                    {% csrf_token %}
                    {{form.as_p}}

                    <button type="submit">Adicionar</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
